<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assignment Upload - Classroom</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f1f3f4;
            margin: 0;
        }

```
    /* Header */
    .header {
        background-color: #1a73e8;
        color: white;
        padding: 15px;
        font-size: 22px;
        text-align: center;
    }

    /* Main container */
    .container {
        width: 60%;
        margin: 30px auto;
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    h2 {
        color: #202124;
    }

    .details {
        background: #f8f9fa;
        padding: 15px;
        border-radius: 6px;
        margin-bottom: 20px;
    }

    label {
        font-weight: bold;
    }

    input[type="file"],
    textarea {
        width: 100%;
        margin-top: 8px;
        margin-bottom: 15px;
        padding: 8px;
    }

    textarea {
        height: 80px;
        resize: none;
    }

    .submit-btn {
        background-color: #1a73e8;
        color: white;
        border: none;
        padding: 10px 20px;
        font-size: 16px;
        border-radius: 4px;
        cursor: pointer;
    }

    .submit-btn:hover {
        background-color: #1557b0;
    }

    .status {
        color: green;
        margin-top: 10px;
        display: none;
    }
</style>
```

</head>
<body>

<div class="header">
    Google Classroom - Assignment
</div>

<div class="container">
    <h2>Assignment: Web Technology Project</h2>

```
<div class="details">
    <p><strong>Subject:</strong> Web Technology</p>
    <p><strong>Due Date:</strong> 20 Feb 2026</p>
    <p><strong>Instructions:</strong> Upload your HTML/CSS project file before the deadline.</p>
</div>

<form onsubmit="submitAssignment(event)">
    <label>Upload File:</label>
    <input type="file" required>

    <label>Private Comment (Optional):</label>
    <textarea placeholder="Add a comment to your teacher..."></textarea>

    <button class="submit-btn" type="submit">Turn In</button>

    <p class="status" id="status">Assignment Submitted Successfully!</p>
</form>
```

</div>

<script>
function submitAssignment(event) {
    event.preventDefault();
    document.getElementById("status").style.display = "block";
}
</script>

</body>
</html>
