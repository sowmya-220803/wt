<!DOCTYPE html>
<html>
<head>
    <title>GOOGLE CLASSROOM</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, sans-serif;
        }

        .container{
            background-color:#f1f3f4;
        }

    
        .top-navigation{
            height:60px;
            width:100%;
            background-color:white;
            display:flex;
            align-items:center;
            justify-content:space-between;
            padding:0 20px;
            border-bottom:1px solid #ddd;
        }

        .lin{
            display:flex;
            align-items:center;
            gap:15px;
        }

        .images{
            width:32px;
            height:32px;
        
        }

        .in, .ini, .ina{
            position:static;
        }

        
        .right-icons{
            display:flex;
            align-items:center;
            gap:20px;
        }

    
        .layout{
            display:flex;
        }

    
        .side-navigation{
            background-color:white;
            width:240px;
            
            padding:15px;
            border-right:1px solid #ddd;
        }

        .home{
            display:flex;
            align-items:center;
            gap:15px;
            padding:10px;
            border-radius:5px;
            
        }

        .home:hover{
            background-color:#e8f0fe;
        }

        a{
            text-decoration:none;
            color:black;
        }

        
        main{
            flex:1;
            padding:25px;
        }

        .class-grid{
            display:grid;
            grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
            gap:25px;
        }

        .class-card{
            height:180px;
        
            color:white;
            border-radius:10px;
            padding:15px;
            position:relative;
        }

        .class-card h2{
            font-size:20px;
        }

        .class-card p{
            margin-top:5px;
            font-size:14px;
        }

        .card-dots{
            position:absolute;
            top:10px;
            right:10px;
            font-size:20px;
        }
    </style>

    <link rel="short icon" type="image" href="goicon.jpeg">
</head>

</nav>

<div class="layout">

    <div class="home">

    <div class="home">

    <div class="home">

    <div class="home">

    <div class="home">
        <img src="setting.png" class="images">

    </div>
</aside>

<main>

        <div class="class-card" style="background-image:url('c.png')">

<div class="class-card" style="background-image:url('color.jpeg')">

    </div>
</main>

</div>

</body>
</html>
